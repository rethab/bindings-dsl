name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Portable packages that need no system library of their own: the
  # bindings-DSL library itself and bindings-posix. Exercised across a
  # range of GHC versions.
  #
  # 9.14 is the version the runner image ships preinstalled (see the
  # "Haskell Tools" section of the image release notes). Every other version
  # is a ~100s ghcup install, so keeping this leg aligned with the image
  # buys coverage of the newest compiler for free; the rest earn their cost.
  build:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6', '9.8', '9.10', '9.12', '9.14']

    steps:
      - uses: actions/checkout@v7

      # cabal resolves the whole project, so bindings-libcddb's
      # pkgconfig-depends must be satisfiable even here.
      - name: Install project-wide pkg-config dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcddb2-dev pkg-config

      - name: Set up GHC ${{ matrix.ghc }}
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'
          cabal-update: true

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Build
        run: cabal build bindings-DSL bindings-posix

  # The versions and checksums come from GnuPG's signed release database so
  # that neither rests on transport security alone. The pinned signing keys
  # match the fingerprints on https://gnupg.org/signature_key.html; if GnuPG
  # rotates keys, this job fails until the .asc is refreshed from there.
  gpgme-versions:
    name: resolve gpgme versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}

    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest gpgme 1.x and 2.x
        id: resolve
        run: |
          curl -fsS -o swdb.lst https://versions.gnupg.org/swdb.lst
          curl -fsS -o swdb.lst.sig https://versions.gnupg.org/swdb.lst.sig
          gpg --dearmor < .github/gnupg-release-keys.asc > keyring.gpg
          gpgv --keyring ./keyring.gpg swdb.lst.sig swdb.lst

          v1=$(awk '$1 == "gpgme1_ver"  { print $2 }' swdb.lst)
          s1=$(awk '$1 == "gpgme1_sha2" { print $2 }' swdb.lst)
          v2=$(awk '$1 == "gpgme_ver"   { print $2 }' swdb.lst)
          s2=$(awk '$1 == "gpgme_sha2"  { print $2 }' swdb.lst)
          case "$v1" in 1.*) ;; *) echo "unexpected gpgme 1.x version: '$v1'" >&2; exit 1 ;; esac
          case "$v2" in 2.*) ;; *) echo "unexpected gpgme 2.x version: '$v2'" >&2; exit 1 ;; esac
          test -n "$s1" && test -n "$s2"

          echo "matrix=[{\"version\":\"$v1\",\"sha256\":\"$s1\"},{\"version\":\"$v2\",\"sha256\":\"$s2\"}]" >> "$GITHUB_OUTPUT"

  # bindings-gpgme needs the gpgme system library and its headers, so it
  # gets its own job that installs them first.
  #
  # gpgme 2.0 removed the trust item API (deprecated since 1.14), so the
  # binding has to compile against both the 1.x and 2.x series. Ubuntu only
  # ships 1.18, which cannot show that difference, so the latest release of
  # each series is built from source and exercised as its own matrix leg.
  gpgme:
    name: bindings-gpgme (gpgme ${{ matrix.gpgme.version }})
    runs-on: ubuntu-latest
    needs: gpgme-versions
    strategy:
      fail-fast: false
      matrix:
        gpgme: ${{ fromJSON(needs.gpgme-versions.outputs.matrix) }}

    env:
      GPGME_PREFIX: ${{ github.workspace }}/gpgme-install

    steps:
      - uses: actions/checkout@v7

      # libcddb2-dev is not a gpgme dependency; the solver needs it (see the
      # build job).
      - name: Install gpgme build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpg-error-dev libassuan-dev libcddb2-dev pkg-config

      - name: Cache gpgme ${{ matrix.gpgme.version }}
        id: cache-gpgme
        uses: actions/cache@v6
        with:
          path: ${{ env.GPGME_PREFIX }}
          key: ${{ runner.os }}-gpgme-lib-${{ matrix.gpgme.version }}

      - name: Build gpgme ${{ matrix.gpgme.version }}
        if: steps.cache-gpgme.outputs.cache-hit != 'true'
        run: |
          curl -fsSLO https://gnupg.org/ftp/gcrypt/gpgme/gpgme-${{ matrix.gpgme.version }}.tar.bz2
          echo "${{ matrix.gpgme.sha256 }}  gpgme-${{ matrix.gpgme.version }}.tar.bz2" | sha256sum -c -
          tar xjf gpgme-${{ matrix.gpgme.version }}.tar.bz2
          cd gpgme-${{ matrix.gpgme.version }}
          ./configure --prefix="$GPGME_PREFIX"
          make -j"$(nproc)"
          make install

      # What this job varies is the gpgme version, not the compiler, so it
      # uses whichever GHC the runner image preinstalls (see the build job).
      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14'
          cabal-version: 'latest'
          cabal-update: true

      # The Haskell dependencies don't vary with the gpgme version, so both
      # matrix legs share one cabal store cache.
      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-gpgme-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-gpgme-

      # hsc2hs compiles and *runs* a helper binary linked against libgpgme, so
      # the freshly built library has to be on the runtime loader path too.
      - name: Build
        env:
          LD_LIBRARY_PATH: ${{ env.GPGME_PREFIX }}/lib
        run: |
          cabal build bindings-gpgme \
            --extra-include-dirs="$GPGME_PREFIX/include" \
            --extra-lib-dirs="$GPGME_PREFIX/lib"

  # GCC 14 is pinned because the runner default (GCC 13) does not error on
  # incompatible pointer types and would have missed #46.
  libcddb:
    name: bindings-libcddb (GCC 14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install libcddb and GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y libcddb2-dev pkg-config gcc-14

      # What this job varies is the C toolchain, not the compiler, so it uses
      # whichever GHC the runner image preinstalls (see the build job).
      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14'
          cabal-version: 'latest'
          cabal-update: true

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-libcddb-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-libcddb-

      - name: Build
        run: cabal build bindings-libcddb --with-gcc=gcc-14

  # Debian/Ubuntu install HDF5 under a serial/parallel split that the
  # package's buildinfo.in does not pass along, so the paths are given to
  # cabal directly.
  hdf5:
    name: bindings-hdf5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install HDF5
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libcddb2-dev pkg-config

      # What this job varies is the HDF5 layout, not the compiler, so it uses
      # whichever GHC the runner image preinstalls (see the build job).
      - name: Set up GHC
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.14'
          cabal-version: 'latest'
          cabal-update: true

      - name: Cache cabal store
        uses: actions/cache@v6
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-hdf5-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: ${{ runner.os }}-hdf5-

      - name: Build
        run: |
          arch=$(gcc -print-multiarch)
          cabal build bindings-hdf5 \
            --extra-include-dirs=/usr/include/hdf5/serial \
            --extra-lib-dirs="/usr/lib/$arch/hdf5/serial"

  # A package that cannot be packaged cannot be released, and Hackage takes a
  # version only once. Both failures are cheap here and permanent after a tag
  # push, so every package is checked and packaged on every PR. Neither cabal
  # check nor cabal sdist resolves dependencies or runs pkg-config, so this
  # needs none of the C libraries the bindings wrap.
  #
  # It needs no compiler and no package index either: both commands read the
  # .cabal file and the working tree, nothing else. So this job uses the cabal
  # the runner image already ships rather than provisioning a toolchain, which
  # is what the rest of its runtime used to be.
  publishable:
    name: Publishable
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - bindings-DSL
          - bindings-posix
          - bindings-gpgme
          - bindings-libcddb
          - bindings-hdf5
          - bindings-glib
          - bindings-gsl
          - bindings-fann
          - bindings-sqlite3
          - bindings-libffi
          - bindings-directfb

    steps:
      - uses: actions/checkout@v7

      - name: Check and package ${{ matrix.package }}
        run: |
          set -euo pipefail
          name='${{ matrix.package }}'

          if [ "$name" = 'bindings-DSL' ]; then
            dir='.'
          else
            dir="$name"
          fi

          cd "$dir"
          cabal check

          # Naming the package as an sdist target selects its library component,
          # which cabal refuses to package alone, and 'all' against the root
          # cabal.project would emit a tarball per project member. A
          # single-package project makes 'all' mean exactly this package, and
          # keeps the six packages missing from cabal.project working too.
          printf 'packages: .\n' > release.project
          cabal sdist --project-file=release.project all --output-dir "$RUNNER_TEMP/sdist"

          version=$(sed -n 's/^version:[[:space:]]*//p' "$name.cabal" | head -1 | tr -d '[:space:]')
          test -f "$RUNNER_TEMP/sdist/$name-$version.tar.gz"
